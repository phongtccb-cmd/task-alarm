<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Task Alarm Dashboard</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glow-red {
      box-shadow: 0 0 20px -5px rgba(239, 68, 68, 0.4);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12 antialiased selection:bg-blue-500 selection:text-white">

  <!-- Top Navigation Header -->
  <header class="sticky top-0 z-50 glass-card border-b border-slate-800/80 px-3 py-3 mb-6">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/20">
          <i data-lucide="alarm-clock" class="w-4 h-4 text-white"></i>
        </div>
        <div>
          <h1 class="font-bold text-sm tracking-tight leading-tight">Task Alarm</h1>
          <p id="liveClock" class="text-[10px] text-slate-400 font-medium">--:--:--</p>
        </div>
      </div>
      
      <!-- Control Buttons -->
      <div class="flex items-center gap-1.5">
        <!-- Test Notification Button -->
        <button onclick="testNotification()" class="p-2 rounded-xl bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 transition flex items-center gap-1 text-xs font-medium border border-amber-500/30">
          <i data-lucide="send" class="w-3.5 h-3.5"></i>
          <span class="text-[11px]">Thử TB</span>
        </button>

        <!-- Notification Toggle -->
        <button id="notifToggleBtn" onclick="requestNotificationPermission()" class="p-2 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-slate-400 transition flex items-center gap-1 text-xs font-medium border border-slate-700/50">
          <i id="notifIcon" data-lucide="bell-off" class="w-3.5 h-3.5"></i>
        </button>

        <!-- Sound Alert Toggle -->
        <button id="soundToggleBtn" onclick="toggleSound()" class="p-2 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-slate-400 transition flex items-center gap-1 text-xs font-medium border border-slate-700/50">
          <i id="soundIcon" data-lucide="volume-x" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 space-y-5">

    <!-- Status Overview Pills -->
    <div class="grid grid-cols-2 gap-3">
      <div class="glass-card p-3.5 rounded-2xl flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-rose-500/10 text-rose-400 flex items-center justify-center border border-rose-500/20">
          <i data-lucide="alert-circle" class="w-5 h-5"></i>
        </div>
        <div>
          <span class="text-xs text-slate-400 block font-medium">Quá hạn</span>
          <span id="statOverdue" class="text-xl font-bold text-rose-400">0</span>
        </div>
      </div>

      <div class="glass-card p-3.5 rounded-2xl flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-blue-500/10 text-blue-400 flex items-center justify-center border border-blue-500/20">
          <i data-lucide="clock" class="w-5 h-5"></i>
        </div>
        <div>
          <span class="text-xs text-slate-400 block font-medium">Đang chờ</span>
          <span id="statPending" class="text-xl font-bold text-blue-400">0</span>
        </div>
      </div>
    </div>

    <!-- Quick Add Form Card -->
    <div class="glass-card p-4 rounded-2xl shadow-xl space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
          <i data-lucide="plus-circle" class="w-4 h-4 text-blue-400"></i> Thêm việc cần làm
        </h2>
      </div>

      <form id="addForm" class="space-y-3">
        <div>
          <input type="text" id="title" placeholder="Ví dụ: Ký hồ sơ trình Sở..." required 
                 class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition">
        </div>

        <div class="flex gap-2">
          <input type="datetime-local" id="dueAt" required 
                 class="flex-1 bg-slate-900/90 border border-slate-700/80 rounded-xl px-3.5 py-2 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition">
          <button type="submit" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-xs font-semibold px-4 py-2 rounded-xl shadow-lg shadow-blue-600/25 transition active:scale-95 flex items-center gap-1">
            <i data-lucide="check" class="w-4 h-4"></i> Lưu
          </button>
        </div>

        <!-- Quick Time Presets -->
        <div class="flex items-center gap-1.5 pt-1 overflow-x-auto no-scrollbar">
          <span class="text-[11px] text-slate-500 whitespace-nowrap">Nhanh:</span>
          <button type="button" onclick="setQuickTime(15)" class="px-2.5 py-1 rounded-lg bg-slate-800/60 hover:bg-slate-700/60 text-[11px] text-slate-300 border border-slate-700/40 whitespace-nowrap">+15 Phút</button>
          <button type="button" onclick="setQuickTime(60)" class="px-2.5 py-1 rounded-lg bg-slate-800/60 hover:bg-slate-700/60 text-[11px] text-slate-300 border border-slate-700/40 whitespace-nowrap">+1 Giờ</button>
          <button type="button" onclick="setQuickTime(1440)" class="px-2.5 py-1 rounded-lg bg-slate-800/60 hover:bg-slate-700/60 text-[11px] text-slate-300 border border-slate-700/40 whitespace-nowrap">Sáng mai (8h)</button>
        </div>
      </form>
    </div>

    <!-- Task List Section -->
    <div class="space-y-3">
      <div class="flex items-center justify-between px-1">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
          <i data-lucide="list-todo" class="w-4 h-4 text-slate-400"></i> Danh sách nhắc hẹn
        </h2>
        <button onclick="loadTasks()" class="text-xs text-slate-400 hover:text-white transition flex items-center gap-1">
          <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i> Làm mới
        </button>
      </div>

      <div id="taskList" class="space-y-2.5">
        <!-- Dynamic Tasks Render Here -->
      </div>
    </div>

  </main>

  <script>
    let soundEnabled = false;
    let audioCtx = null;
    let notifiedTasks = new Set();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then(() => {
        console.log('Service Worker đã đăng ký!');
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      updateClock();
      setInterval(updateClock, 1000);
      setDefaultDateTime();
      checkNotificationStatus();
      loadTasks();
      setInterval(loadTasks, 3000); // Kiểm tra mỗi 3 giây
    });

    function updateClock() {
      const now = new Date();
      document.getElementById('liveClock').innerText = now.toLocaleTimeString('vi-VN');
    }

    function setDefaultDateTime() {
      const now = new Date(Date.now() + 30 * 60000);
      const isoString = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);
      document.getElementById('dueAt').value = isoString;
    }

    function setQuickTime(minutes) {
      let target;
      if (minutes === 1440) {
        target = new Date();
        target.setDate(target.getDate() + 1);
        target.setHours(8, 0, 0, 0);
      } else {
        target = new Date(Date.now() + minutes * 60000);
      }
      const localISO = new Date(target.getTime() - (target.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);
      document.getElementById('dueAt').value = localISO;
    }

    async function requestNotificationPermission() {
      if (!('Notification' in window)) {
        alert('Trình duyệt không hỗ trợ thông báo hệ thống.');
        return;
      }
      const permission = await Notification.requestPermission();
      checkNotificationStatus();
      if (permission === 'granted') {
        testNotification();
      } else {
        alert('Bạn đã từ chối quyền thông báo. Hãy bật lại trong Cài đặt Chrome của Android.');
      }
    }

    function testNotification() {
      if (!('Notification' in window) || Notification.permission !== 'granted') {
        requestNotificationPermission();
      } else {
        sendSystemNotification('⏰ Task Alarm Test', 'Thông báo Android đang hoạt động rất tốt!', 'test_' + Date.now());
      }
    }

    function checkNotificationStatus() {
      const btn = document.getElementById('notifToggleBtn');
      const icon = document.getElementById('notifIcon');

      if ('Notification' in window && Notification.permission === 'granted') {
        btn.classList.add('bg-emerald-600/20', 'text-emerald-400', 'border-emerald-500/40');
        icon.setAttribute('data-lucide', 'bell');
      } else {
        btn.classList.remove('bg-emerald-600/20', 'text-emerald-400', 'border-emerald-500/40');
        icon.setAttribute('data-lucide', 'bell-off');
      }
      lucide.createIcons();
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('soundToggleBtn');
      const icon = document.getElementById('soundIcon');
      if (soundEnabled) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        btn.classList.add('bg-blue-600/20', 'text-blue-400', 'border-blue-500/40');
        icon.setAttribute('data-lucide', 'volume-2');
        playChime();
      } else {
        btn.classList.remove('bg-blue-600/20', 'text-blue-400', 'border-blue-500/40');
        icon.setAttribute('data-lucide', 'volume-x');
      }
      lucide.createIcons();
    }

    function playChime() {
      if (!soundEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      } catch (e) {}
    }

    async function sendSystemNotification(title, body, tag) {
      if ('Notification' in window && Notification.permission === 'granted') {
        try {
          if ('serviceWorker' in navigator) {
            const reg = await navigator.serviceWorker.ready;
            await reg.showNotification(title, {
              body: body,
              vibrate: [300, 100, 300],
              tag: tag || 'task-alarm',
              renotify: true
            });
          } else {
            new Notification(title, { body });
          }
        } catch (e) {
          console.error("Lỗi gửi thông báo:", e);
        }
      }
    }

    function getLocalTasks() {
      return JSON.parse(localStorage.getItem('tasks_data') || '[]');
    }
    function setLocalTasks(tasks) {
      localStorage.setItem('tasks_data', JSON.stringify(tasks));
    }

    async function loadTasks() {
      if (navigator.onLine) {
        try {
          await syncOfflineData();
          const res = await fetch('/api/tasks');
          if (res.ok) {
            const tasks = await res.json();
            setLocalTasks(tasks);
          }
        } catch (e) {}
      }
      renderTaskList();
    }

    function renderTaskList() {
      const tasks = getLocalTasks().filter(t => t.status === 'pending');
      const list = document.getElementById('taskList');
      list.innerHTML = '';

      const now = new Date().getTime();
      let overdueCount = 0;
      let pendingCount = 0;

      if (tasks.length === 0) {
        list.innerHTML = `
          <div class="glass-card p-8 rounded-2xl text-center space-y-2">
            <i data-lucide="sparkles" class="w-8 h-8 text-slate-500 mx-auto"></i>
            <p class="text-xs text-slate-400">Không có công việc nào cần xử lý!</p>
          </div>`;
        lucide.createIcons();
        document.getElementById('statOverdue').innerText = '0';
        document.getElementById('statPending').innerText = '0';
        return;
      }

      tasks.forEach(task => {
        const due = new Date(task.due_at).getTime();
        const diffMin = Math.round((due - now) / 60000);
        const isOverdue = diffMin <= 0;

        if (isOverdue) {
          overdueCount++;
          const notifKey = `task_${task.id}_${task.due_at}`;
          if (!notifiedTasks.has(notifKey)) {
            notifiedTasks.add(notifKey);
            playChime();
            sendSystemNotification('⏰ Cảnh báo nhắc hẹn!', `Công việc "${task.title}" đã đến hạn!`, notifKey);
          }
        } else {
          pendingCount++;
        }

        const card = document.createElement('div');
        card.className = `glass-card p-3.5 rounded-2xl border transition-all duration-300 space-y-2.5 ${
          isOverdue ? 'border-rose-500/50 bg-rose-950/20 glow-red' : 'border-slate-800'
        }`;

        const formattedTime = new Date(task.due_at).toLocaleString('vi-VN', {
          hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit'
        });

        card.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <div class="space-y-1">
              <h3 class="text-sm font-semibold text-slate-100 ${isOverdue ? 'text-rose-200' : ''}">${escapeHtml(task.title)}</h3>
              <div class="flex items-center gap-2 text-[11px]">
                <span class="text-slate-400 flex items-center gap-1">
                  <i data-lucide="calendar" class="w-3 h-3"></i> ${formattedTime}
                </span>
                <span class="px-2 py-0.5 rounded-md font-medium ${
                  isOverdue 
                    ? 'bg-rose-500/20 text-rose-300 border border-rose-500/30 animate-pulse' 
                    : (diffMin <= 15 ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : 'bg-slate-800 text-slate-400')
                }">
                  ${isOverdue ? `Quá hạn ${Math.abs(diffMin)} phút` : `Còn ${diffMin} phút`}
                </span>
              </div>
            </div>
          </div>

          <div class="flex items-center justify-between pt-1 border-t border-slate-800/60">
            <div class="flex items-center gap-1">
              <button onclick="snooze(${task.id}, 15)" class="px-2 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-[11px] text-slate-300 transition">+15p</button>
              <button onclick="snooze(${task.id}, 60)" class="px-2 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-[11px] text-slate-300 transition">+1h</button>
            </div>
            <button onclick="complete(${task.id})" class="px-3 py-1 rounded-lg bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/30 text-[11px] font-semibold transition flex items-center gap-1">
              <i data-lucide="check" class="w-3.5 h-3.5"></i> Xong
            </button>
          </div>
        `;
        list.appendChild(card);
      });

      document.getElementById('statOverdue').innerText = overdueCount;
      document.getElementById('statPending').innerText = pendingCount;
      lucide.createIcons();
    }

    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const dueInput = document.getElementById('dueAt').value;
      if (!dueInput) return;

      const due_at = new Date(dueInput).toISOString();
      const newTask = { id: Date.now(), title, due_at, status: 'pending', unsynced: true };

      const tasks = getLocalTasks();
      tasks.push(newTask);
      setLocalTasks(tasks);
      renderTaskList();

      document.getElementById('title').value = '';
      setDefaultDateTime();

      if (navigator.onLine) {
        await fetch('/api/tasks', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ title, due_at })
        });
        loadTasks();
      }
    });

    async function snooze(id, minutes) {
      const tasks = getLocalTasks();
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.due_at = new Date(Date.now() + minutes * 60000).toISOString();
        task.unsynced_action = { action: 'snooze', minutes };
        setLocalTasks(tasks);
        notifiedTasks.delete(`task_${task.id}_${task.due_at}`);
        renderTaskList();
      }

      if (navigator.onLine) {
        await fetch('/api/tasks', {
          method: 'PUT',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ id, action: 'snooze', minutes })
        });
        loadTasks();
      }
    }

    async function complete(id) {
      let tasks = getLocalTasks();
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.status = 'completed';
        task.unsynced_action = { action: 'complete' };
        setLocalTasks(tasks);
        renderTaskList();
      }

      if (navigator.onLine) {
        await fetch('/api/tasks', {
          method: 'PUT',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ id, action: 'complete' })
        });
        loadTasks();
      }
    }

    async function syncOfflineData() {
      const tasks = getLocalTasks();
      const unsynced = tasks.filter(t => t.unsynced);

      for (let t of unsynced) {
        await fetch('/api/tasks', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ title: t.title, due_at: t.due_at })
        });
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
