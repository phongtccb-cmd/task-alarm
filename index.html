<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Task Alarm Dashboard</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glow-red {
      box-shadow: 0 0 20px -5px rgba(239, 68, 68, 0.4);
    }
    .glow-blue {
      box-shadow: 0 0 25px -5px rgba(59, 130, 246, 0.25);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-24 antialiased selection:bg-blue-500 selection:text-white">

  <!-- Header Top Bar -->
  <header class="sticky top-0 z-40 glass-card border-b border-slate-800/80 px-4 py-3 mb-4">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/20">
          <i data-lucide="alarm-clock" class="w-4 h-4 text-white"></i>
        </div>
        <div>
          <h1 class="font-bold text-sm tracking-tight leading-tight">Task Alarm</h1>
          <p id="liveClockText" class="text-[10px] text-slate-400 font-medium">--:--:--</p>
        </div>
      </div>
      
      <!-- Quick Controls -->
      <div class="flex items-center gap-1.5">
        <button onclick="testNotification()" class="p-2 rounded-xl bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 transition flex items-center gap-1 text-xs font-medium border border-amber-500/30 active:scale-95">
          <i data-lucide="send" class="w-3.5 h-3.5"></i>
          <span class="text-[11px]">Thử TB</span>
        </button>

        <button id="notifToggleBtn" onclick="requestNotificationPermission()" class="p-2 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-slate-400 transition flex items-center gap-1 text-xs font-medium border border-slate-700/50">
          <i id="notifIcon" data-lucide="bell-off" class="w-3.5 h-3.5"></i>
        </button>

        <button id="soundToggleBtn" onclick="toggleSound()" class="p-2 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-slate-400 transition flex items-center gap-1 text-xs font-medium border border-slate-700/50">
          <i id="soundIcon" data-lucide="volume-x" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto px-4">

    <!-- TAB 1: CÔNG VIỆC GẦN NHẤT -->
    <div id="tab1Content" class="space-y-4">
      
      <!-- Khung đếm ngược / Trạng thái tổng quan ngắn -->
      <div class="glass-card p-4 rounded-2xl glow-blue text-center">
        <div id="countdownText" class="font-semibold text-sm text-blue-400 min-h-[20px]">
          Đang tải thông tin...
        </div>
      </div>

      <!-- Khung Công Việc Gần Nhất -->
      <div class="space-y-2">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center justify-between px-1">
          <span class="flex items-center gap-1.5"><i data-lucide="zap" class="w-4 h-4 text-amber-400"></i> Công việc cần làm tiếp theo</span>
          <span class="text-[10px] text-slate-500 font-normal">Ưu tiên số 1</span>
        </h2>

        <div id="nextTaskCard">
          <!-- Task gần nhất render tại đây -->
        </div>
      </div>

      <!-- Thêm Nhanh Công Việc -->
      <div class="glass-card p-4 rounded-2xl shadow-xl space-y-3">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
          <i data-lucide="plus-circle" class="w-4 h-4 text-blue-400"></i> Thêm việc cần làm
        </h2>
        
        <form id="addFormTab1" class="space-y-3">
          <input type="text" id="title1" placeholder="Ví dụ: Họp ban giám đốc..." required 
                 class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50">
          
          <div class="flex gap-2">
            <input type="datetime-local" id="dueAt1" required 
                   class="flex-1 bg-slate-900/90 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/50">
            <button type="submit" id="submitBtn1" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-4 py-2 rounded-xl transition flex items-center gap-1">
              <i data-lucide="check" class="w-4 h-4"></i> Lưu
            </button>
          </div>

          <div class="flex items-center gap-1.5 pt-1 overflow-x-auto no-scrollbar">
            <span class="text-[11px] text-slate-500 whitespace-nowrap">Nhanh:</span>
            <button type="button" onclick="setQuickTimeTab1(15)" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-[11px] text-slate-300 border border-slate-700/40 whitespace-nowrap">+15 Phút</button>
            <button type="button" onclick="setQuickTimeTab1(60)" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-[11px] text-slate-300 border border-slate-700/40 whitespace-nowrap">+1 Giờ</button>
            <button type="button" onclick="setQuickTimeTab1(1440)" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-[11px] text-slate-300 border border-slate-700/40 whitespace-nowrap">Sáng mai (8h)</button>
          </div>
        </form>
      </div>

    </div>

    <!-- TAB 2: DANH MỤC TẤT CẢ CÔNG VIỆC -->
    <div id="tab2Content" class="space-y-4 hidden">

      <!-- Status Overview Pills -->
      <div class="grid grid-cols-2 gap-3">
        <div class="glass-card p-3.5 rounded-2xl flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-rose-500/10 text-rose-400 flex items-center justify-center border border-rose-500/20">
            <i data-lucide="alert-circle" class="w-5 h-5"></i>
          </div>
          <div>
            <span class="text-xs text-slate-400 block font-medium">Quá hạn</span>
            <span id="statOverdue" class="text-xl font-bold text-rose-400">0</span>
          </div>
        </div>

        <div class="glass-card p-3.5 rounded-2xl flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-blue-500/10 text-blue-400 flex items-center justify-center border border-blue-500/20">
            <i data-lucide="clock" class="w-5 h-5"></i>
          </div>
          <div>
            <span class="text-xs text-slate-400 block font-medium">Đang chờ</span>
            <span id="statPending" class="text-xl font-bold text-blue-400">0</span>
          </div>
        </div>
      </div>

      <!-- Header Danh Sách -->
      <div class="flex items-center justify-between px-1">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
          <i data-lucide="list-todo" class="w-4 h-4 text-slate-400"></i> Danh mục công việc
        </h2>
        <button onclick="loadTasks()" class="text-xs text-slate-400 hover:text-white transition flex items-center gap-1">
          <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i> Làm mới
        </button>
      </div>

      <!-- Danh Sách Công Việc -->
      <div id="taskList" class="space-y-2.5">
        <!-- Tất cả tasks render tại đây -->
      </div>

    </div>

  </main>

  <!-- THANH ĐIỀU HƯỚNG BOTTOM TABS (2 TAB) -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 glass-card border-t border-slate-800/80 px-6 py-2">
    <div class="max-w-md mx-auto flex items-center justify-around">
      
      <!-- Tab 1: Công việc gần nhất -->
      <button id="navTab1" onclick="switchTab('tab1')" class="flex flex-col items-center gap-1 py-1 px-5 rounded-2xl text-blue-400 transition font-semibold">
        <i data-lucide="alarm-clock" class="w-5 h-5"></i>
        <span class="text-[11px]">Gần nhất</span>
      </button>

      <!-- Tab 2: Danh mục công việc -->
      <button id="navTab2" onclick="switchTab('tab2')" class="flex flex-col items-center gap-1 py-1 px-5 rounded-2xl text-slate-400 transition hover:text-slate-200 font-medium">
        <i data-lucide="list-checks" class="w-5 h-5"></i>
        <span class="text-[11px]">Danh mục</span>
      </button>

    </div>
  </nav>

  <script>
    let soundEnabled = false;
    let audioCtx = null;
    let notifiedTasks = new Set();
    let swRegistration = null;
    let isSubmitting = false;

    // Đăng ký Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => { swRegistration = reg; })
        .catch((err) => { console.error('Lỗi SW:', err); });
    }

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      updateClock();
      setInterval(updateClock, 1000);
      setDefaultDateTime1();
      checkNotificationStatus();
      cleanUpDuplicateTasks();
      loadTasks();
      setInterval(loadTasks, 3000);
    });

    function updateClock() {
      const now = new Date();
      const clockElem = document.getElementById('liveClockText');
      if (clockElem) clockElem.innerText = now.toLocaleTimeString('vi-VN');
    }

    function switchTab(tab) {
      const t1Content = document.getElementById('tab1Content');
      const t2Content = document.getElementById('tab2Content');
      const nav1 = document.getElementById('navTab1');
      const nav2 = document.getElementById('navTab2');

      if (tab === 'tab1') {
        t1Content.classList.remove('hidden');
        t2Content.classList.add('hidden');
        nav1.className = "flex flex-col items-center gap-1 py-1 px-5 rounded-2xl text-blue-400 transition font-semibold";
        nav2.className = "flex flex-col items-center gap-1 py-1 px-5 rounded-2xl text-slate-400 transition hover:text-slate-200 font-medium";
      } else {
        t1Content.classList.add('hidden');
        t2Content.classList.remove('hidden');
        nav1.className = "flex flex-col items-center gap-1 py-1 px-5 rounded-2xl text-slate-400 transition hover:text-slate-200 font-medium";
        nav2.className = "flex flex-col items-center gap-1 py-1 px-5 rounded-2xl text-blue-400 transition font-semibold";
      }
      lucide.createIcons();
    }

    function setDefaultDateTime1() {
      const now = new Date(Date.now() + 30 * 60000);
      const isoString = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);
      document.getElementById('dueAt1').value = isoString;
    }

    function setQuickTimeTab1(minutes) {
      let target;
      if (minutes === 1440) {
        target = new Date();
        target.setDate(target.getDate() + 1);
        target.setHours(8, 0, 0, 0);
      } else {
        target = new Date(Date.now() + minutes * 60000);
      }
      const localISO = new Date(target.getTime() - (target.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);
      document.getElementById('dueAt1').value = localISO;
    }

    async function requestNotificationPermission() {
      if (!('Notification' in window)) {
        alert('Trình duyệt không hỗ trợ thông báo.');
        return;
      }
      const permission = await Notification.requestPermission();
      checkNotificationStatus();
      if (permission === 'granted') testNotification();
    }

    async function testNotification() {
      if (!('Notification' in window) || Notification.permission !== 'granted') {
        await requestNotificationPermission();
      } else {
        sendSystemNotification('⏰ Task Alarm Test', 'Thông báo hoạt động hoàn hảo!', 'test_' + Date.now());
      }
    }

    function checkNotificationStatus() {
      const btn = document.getElementById('notifToggleBtn');
      const icon = document.getElementById('notifIcon');

      if ('Notification' in window && Notification.permission === 'granted') {
        btn.classList.add('bg-emerald-600/20', 'text-emerald-400', 'border-emerald-500/40');
        icon.setAttribute('data-lucide', 'bell');
      } else {
        btn.classList.remove('bg-emerald-600/20', 'text-emerald-400', 'border-emerald-500/40');
        icon.setAttribute('data-lucide', 'bell-off');
      }
      lucide.createIcons();
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('soundToggleBtn');
      const icon = document.getElementById('soundIcon');
      
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      if (soundEnabled) {
        btn.classList.add('bg-blue-600/20', 'text-blue-400', 'border-blue-500/40');
        icon.setAttribute('data-lucide', 'volume-2');
        playChime();
      } else {
        btn.classList.remove('bg-blue-600/20', 'text-blue-400', 'border-blue-500/40');
        icon.setAttribute('data-lucide', 'volume-x');
      }
      lucide.createIcons();
    }

    function playChime() {
      if (!soundEnabled || !audioCtx) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.6);
      } catch (e) {}
    }

    async function sendSystemNotification(title, body, tag) {
      if ('Notification' in window && Notification.permission === 'granted') {
        try {
          if ('serviceWorker' in navigator && navigator.serviceWorker.ready) {
            const reg = await navigator.serviceWorker.ready;
            await reg.showNotification(title, {
              body: body,
              icon: './favicon.ico',
              vibrate: [300, 100, 300],
              tag: tag || 'task-alarm',
              renotify: true
            });
          } else {
            new Notification(title, { body });
          }
        } catch (e) {
          new Notification(title, { body });
        }
      }
    }

    function getLocalTasks() {
      const raw = JSON.parse(localStorage.getItem('tasks_data') || '[]');
      const unique = [];
      const seen = new Set();

      for (const t of raw) {
        const key = `${t.title.trim().toLowerCase()}_${t.due_at}_${t.status}`;
        if (!seen.has(key)) {
          seen.add(key);
          unique.push(t);
        }
      }
      return unique;
    }

    function setLocalTasks(tasks) {
      localStorage.setItem('tasks_data', JSON.stringify(tasks));
    }

    function cleanUpDuplicateTasks() {
      setLocalTasks(getLocalTasks());
    }

    async function loadTasks() {
      if (navigator.onLine) {
        try {
          await syncOfflineData();
          const res = await fetch('/api/tasks');
          if (res.ok) {
            const tasks = await res.json();
            if (Array.isArray(tasks)) setLocalTasks(tasks);
          }
        } catch (e) {}
      }
      renderUI();
    }

    function renderUI() {
      const tasks = getLocalTasks().filter(t => t.status === 'pending');
      const now = new Date().getTime();

      // Sắp xếp các task theo thời gian hạn chót từ sớm nhất đến muộn nhất
      tasks.sort((a, b) => new Date(a.due_at).getTime() - new Date(b.due_at).getTime());

      // RENDER TAB 1: CÔNG VIỆC GẦN NHẤT
      renderTab1NearestTask(tasks, now);

      // RENDER TAB 2: DANH MỤC CÔNG VIỆC
      renderTab2TaskList(tasks, now);
    }

    function renderTab1NearestTask(tasks, now) {
      const countdownElem = document.getElementById('countdownText');
      const nextCardElem = document.getElementById('nextTaskCard');

      if (tasks.length === 0) {
        countdownElem.innerHTML = `<span class="text-slate-400 font-normal">Chưa có công việc nào sắp tới</span>`;
        nextCardElem.innerHTML = `
          <div class="glass-card p-6 rounded-2xl text-center space-y-2">
            <i data-lucide="sparkles" class="w-8 h-8 text-slate-500 mx-auto"></i>
            <p class="text-xs text-slate-400">Tất cả công việc đã hoàn thành!</p>
          </div>`;
        lucide.createIcons();
        return;
      }

      const nearestTask = tasks[0]; // Task gần nhất
      const due = new Date(nearestTask.due_at).getTime();
      const diffMin = Math.round((due - now) / 60000);
      const isOverdue = diffMin <= 0;

      // Cập nhật dòng đếm ngược
      if (isOverdue) {
        countdownElem.innerHTML = `<span class="text-rose-400 font-bold animate-pulse">⚠️ Quá hạn ${Math.abs(diffMin)} phút!</span>`;
      } else {
        const hrs = Math.floor(diffMin / 60);
        const mins = diffMin % 60;
        let timeStr = "";
        if (hrs > 0) timeStr += `${hrs} giờ `;
        timeStr += `${mins} phút`;
        countdownElem.innerHTML = `<span class="text-blue-400">Sẽ nhắc sau <strong class="text-white">${timeStr}</strong></span>`;
      }

      // Kích hoạt thông báo đẩy
      if (isOverdue) {
        const notifKey = `task_${nearestTask.id}_${nearestTask.due_at}`;
        if (!notifiedTasks.has(notifKey)) {
          notifiedTasks.add(notifKey);
          playChime();
          sendSystemNotification('⏰ Cảnh báo nhắc hẹn!', `Công việc "${nearestTask.title}" đã đến hạn!`, notifKey);
        }
      }

      const formattedTime = new Date(nearestTask.due_at).toLocaleString('vi-VN', {
        hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit'
      });

      nextCardElem.innerHTML = `
        <div class="glass-card p-4 rounded-2xl border transition-all duration-300 space-y-3 ${
          isOverdue ? 'border-rose-500/60 bg-rose-950/20 glow-red' : 'border-blue-500/40 bg-blue-950/10'
        }">
          <div class="flex items-start justify-between gap-2">
            <div class="space-y-1">
              <h3 class="text-base font-bold text-slate-100 ${isOverdue ? 'text-rose-200' : ''}">${escapeHtml(nearestTask.title)}</h3>
              <div class="flex items-center gap-2 text-xs">
                <span class="text-slate-400 flex items-center gap-1">
                  <i data-lucide="calendar" class="w-3.5 h-3.5"></i> ${formattedTime}
                </span>
                <span class="px-2 py-0.5 rounded-md text-[11px] font-semibold ${
                  isOverdue ? 'bg-rose-500/20 text-rose-300 border border-rose-500/30' : 'bg-blue-500/20 text-blue-300 border border-blue-500/30'
                }">
                  ${isOverdue ? `Quá hạn ${Math.abs(diffMin)}p` : `Còn ${diffMin}p`}
                </span>
              </div>
            </div>
          </div>

          <div class="flex items-center justify-between pt-2 border-t border-slate-800/80">
            <div class="flex items-center gap-1.5">
              <button onclick="snooze(${nearestTask.id}, 15)" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 border border-slate-700/50 transition">+15p</button>
              <button onclick="snooze(${nearestTask.id}, 60)" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 border border-slate-700/50 transition">+1h</button>
            </div>
            <button onclick="complete(${nearestTask.id})" class="px-4 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold shadow-lg shadow-emerald-600/20 transition flex items-center gap-1">
              <i data-lucide="check" class="w-4 h-4"></i> Complete
            </button>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function renderTab2TaskList(tasks, now) {
      const list = document.getElementById('taskList');
      list.innerHTML = '';

      let overdueCount = 0;
      let pendingCount = 0;

      if (tasks.length === 0) {
        list.innerHTML = `
          <div class="glass-card p-8 rounded-2xl text-center space-y-2">
            <i data-lucide="sparkles" class="w-8 h-8 text-slate-500 mx-auto"></i>
            <p class="text-xs text-slate-400">Không có công việc nào trong danh mục!</p>
          </div>`;
        document.getElementById('statOverdue').innerText = '0';
        document.getElementById('statPending').innerText = '0';
        lucide.createIcons();
        return;
      }

      tasks.forEach(task => {
        const due = new Date(task.due_at).getTime();
        const diffMin = Math.round((due - now) / 60000);
        const isOverdue = diffMin <= 0;

        if (isOverdue) overdueCount++;
        else pendingCount++;

        const formattedTime = new Date(task.due_at).toLocaleString('vi-VN', {
          hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit'
        });

        const card = document.createElement('div');
        card.className = `glass-card p-3.5 rounded-2xl border transition-all duration-300 space-y-2.5 ${
          isOverdue ? 'border-rose-500/50 bg-rose-950/20 glow-red' : 'border-slate-800'
        }`;

        card.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <div class="space-y-1">
              <h3 class="text-sm font-semibold text-slate-100 ${isOverdue ? 'text-rose-200' : ''}">${escapeHtml(task.title)}</h3>
              <div class="flex items-center gap-2 text-[11px]">
                <span class="text-slate-400 flex items-center gap-1">
                  <i data-lucide="calendar" class="w-3 h-3"></i> ${formattedTime}
                </span>
                <span class="px-2 py-0.5 rounded-md font-medium ${
                  isOverdue ? 'bg-rose-500/20 text-rose-300 border border-rose-500/30' : 'bg-slate-800 text-slate-400'
                }">
                  ${isOverdue ? `Quá hạn ${Math.abs(diffMin)}p` : `Còn ${diffMin}p`}
                </span>
              </div>
            </div>
          </div>

          <div class="flex items-center justify-between pt-1 border-t border-slate-800/60">
            <div class="flex items-center gap-1">
              <button onclick="snooze(${task.id}, 15)" class="px-2 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-[11px] text-slate-300 transition">+15p</button>
              <button onclick="snooze(${task.id}, 60)" class="px-2 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-[11px] text-slate-300 transition">+1h</button>
            </div>
            <button onclick="complete(${task.id})" class="px-3 py-1 rounded-lg bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/30 text-[11px] font-semibold transition flex items-center gap-1">
              <i data-lucide="check" class="w-3.5 h-3.5"></i> Xong
            </button>
          </div>
        `;
        list.appendChild(card);
      });

      document.getElementById('statOverdue').innerText = overdueCount;
      document.getElementById('statPending').innerText = pendingCount;
      lucide.createIcons();
    }

    // Xử lý Form Submit Tab 1
    document.getElementById('addFormTab1').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (isSubmitting) return;
      isSubmitting = true;

      const titleInput = document.getElementById('title1');
      const dueInput = document.getElementById('dueAt1');
      const submitBtn = document.getElementById('submitBtn1');

      const title = titleInput.value.trim();
      const dueAtValue = dueInput.value;
      if (!title || !dueAtValue) {
        isSubmitting = false;
        return;
      }

      const due_at = new Date(dueAtValue).toISOString();
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-50', 'pointer-events-none');

      try {
        let savedOnline = false;
        if (navigator.onLine) {
          try {
            const res = await fetch('/api/tasks', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({ title, due_at })
            });
            if (res.ok) {
              savedOnline = true;
              await loadTasks();
            }
          } catch (err) {}
        }

        if (!savedOnline) {
          saveOfflineTask(title, due_at);
        }

        titleInput.value = '';
        setDefaultDateTime1();
      } finally {
        setTimeout(() => {
          isSubmitting = false;
          submitBtn.disabled = false;
          submitBtn.classList.remove('opacity-50', 'pointer-events-none');
        }, 500);
      }
    });

    function saveOfflineTask(title, due_at) {
      const tasks = getLocalTasks();
      const exists = tasks.some(t => 
        t.title.trim().toLowerCase() === title.trim().toLowerCase() && 
        t.due_at === due_at && 
        t.status === 'pending'
      );

      if (!exists) {
        const newTask = { id: Date.now(), title, due_at, status: 'pending', unsynced: true };
        tasks.push(newTask);
        setLocalTasks(tasks);
      }
      renderUI();
    }

    async function snooze(id, minutes) {
      const tasks = getLocalTasks();
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.due_at = new Date(Date.now() + minutes * 60000).toISOString();
        setLocalTasks(tasks);
        notifiedTasks.delete(`task_${task.id}_${task.due_at}`);
        renderUI();
      }

      if (navigator.onLine) {
        try {
          await fetch('/api/tasks', {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ id, action: 'snooze', minutes })
          });
          loadTasks();
        } catch(e) {}
      }
    }

    async function complete(id) {
      let tasks = getLocalTasks();
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.status = 'completed';
        setLocalTasks(tasks);
        renderUI();
      }

      if (navigator.onLine) {
        try {
          await fetch('/api/tasks', {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ id, action: 'complete' })
          });
          loadTasks();
        } catch(e) {}
      }
    }

    async function syncOfflineData() {
      const tasks = getLocalTasks();
      const unsynced = tasks.filter(t => t.unsynced);
      if (unsynced.length === 0) return;

      for (let t of unsynced) {
        try {
          const res = await fetch('/api/tasks', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ title: t.title, due_at: t.due_at })
          });
          if (res.ok) t.unsynced = false;
        } catch (e) {}
      }
      setLocalTasks(tasks);
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
