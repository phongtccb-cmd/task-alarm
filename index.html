<!DOCTYPE html>
<html lang="vi">
<head>
<!-- Khai báo PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f172a">

<!-- Tối ưu cho iPhone/iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TaskAlarm">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3652/3652191.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Alarm Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">
  <div class="max-w-2xl mx-auto space-y-6">
    
    <!-- Quick Add Form -->
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg">
      <h1 class="text-xl font-bold mb-3 flex items-center gap-2">⏰ Hẹn Giờ Công Việc</h1>
      <form id="addForm" class="flex flex-col sm:flex-row gap-2">
        <input type="text" id="title" placeholder="Cần làm gì..." required 
               class="flex-1 bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
        <input type="datetime-local" id="dueAt" required 
               class="bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-5 py-2 rounded-lg transition">Thêm</button>
      </form>
    </div>

    <!-- Task List -->
    <div id="taskList" class="space-y-3">
      <!-- Tasks dynamically loaded here -->
    </div>
  </div>

  <script>
    // Lấy danh sách công việc và Render
    async function loadTasks() {
      const res = await fetch('/api/tasks');
      const tasks = await res.json();
      const list = document.getElementById('taskList');
      list.innerHTML = '';

      const now = new Date().getTime();

      tasks.forEach(task => {
        const due = new Date(task.due_at).getTime();
        const diffMin = Math.round((due - now) / 60000);
        const isOverdue = diffMin <= 0;

        const card = document.createElement('div');
        card.className = `p-4 rounded-xl border transition flex flex-col sm:flex-row sm:items-center justify-between gap-3 ${
          isOverdue ? 'bg-red-950/50 border-red-500/50 animate-pulse' : 'bg-slate-800 border-slate-700'
        }`;

        card.innerHTML = `
          <div>
            <h3 class="font-semibold text-lg ${isOverdue ? 'text-red-300' : 'text-slate-100'}">${task.title}</h3>
            <p class="text-xs text-slate-400">Hạn: ${new Date(task.due_at).toLocaleString('vi-VN')} 
               <span class="font-bold ${isOverdue ? 'text-red-400' : 'text-amber-400'}">
                 (${isOverdue ? 'Quá hạn ' + Math.abs(diffMin) + ' phút' : 'Còn ' + diffMin + ' phút'})
               </span>
            </p>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="snooze(${task.id}, 15)" class="px-2.5 py-1 text-xs bg-slate-700 hover:bg-slate-600 rounded text-slate-200">+15p</button>
            <button onclick="snooze(${task.id}, 60)" class="px-2.5 py-1 text-xs bg-slate-700 hover:bg-slate-600 rounded text-slate-200">+1 giờ</button>
            <button onclick="complete(${task.id})" class="px-3 py-1 text-xs bg-emerald-600 hover:bg-emerald-500 text-white rounded font-medium">Xong</button>
          </div>
        `;
        list.appendChild(card);
      });
    }

    // Sự kiện thêm task
    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const due_at = new Date(document.getElementById('dueAt').value).toISOString();
      await fetch('/api/tasks', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ title, due_at })
      });
      document.getElementById('title').value = '';
      loadTasks();
    });

    async function snooze(id, minutes) {
      await fetch('/api/tasks', {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ id, action: 'snooze', minutes })
      });
      loadTasks();
    }

    async function complete(id) {
      await fetch('/api/tasks', {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ id, action: 'complete' })
      });
      loadTasks();
    }

    // Tự động làm mới giao diện mỗi 10 giây để đếm ngược realtime
    setInterval(loadTasks, 10000);
    loadTasks();
  </script>
</body>
</html>
